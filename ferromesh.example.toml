# ferromeshd configuration. Copy to ferromesh.toml and adjust.

# Holds ferromesh.db and the raw/ log. In the container this is the /data volume.
data_dir = "/data"

# Where to record from: a broker, a companion radio, or both. At least one is
# required. Delete this whole section to run from a companion radio alone.
[mqtt]
# Inside the container (host networking) a broker on the same machine is 127.0.0.1:
# .local names don't resolve in containers. From another machine use truffles.local.
host = "127.0.0.1"
port = 1883
# Must be unique per running instance, or the broker keeps disconnecting one of them.
client_id = "ferromeshd"
# username = "ferromesh"
# password = "..."
topics = ["meshcore/+/+/packets", "meshcore/+/+/status"]

[api]
# The HTTP and WebSocket API that ferromesh clients use. Reads are open to anyone
# who can reach this address.
listen = "0.0.0.0:7373"
# Changes such as adding channels need this token (at least 16 characters), sent by
# clients as --token or FERROMESH_TOKEN. Without it the API is read-only.
# Generate one with: openssl rand -hex 24
# token = "..."

# A companion radio (stock MeshCore companion firmware, USB) to record from.
# Every packet it hears is stored as an observation beside the MQTT observers',
# and direct messages sent to it are stored too. ferromeshd must be its only
# client. `auto` finds the one Espressif USB device; otherwise give its port,
# e.g. /dev/serial/by-id/usb-Espressif_... or /dev/cu.usbmodem2101.
#
# [companion]
# device = "auto"

# Room servers to join. A room stores posts and re-broadcasts them to its
# members, so its posts arrive as messages once the radio has logged in. The
# name is the room's advertised name, or a hex prefix of its key; it must have
# been heard advertising. Needs a [companion] radio. Logging in again after a
# radio restart is automatic.
#
# [[room]]
# name = "PeakMesh Room"
# password = "..."

# Channels to decrypt. The public channel is always included.
# Hashtag channels need only their name. Private channels also need their key,
# in hex (as in MeshCore QR codes) or base64:
#
# [[channel]]
# name = "My Group"
# key = "0123456789abcdef0123456789abcdef"

[[channel]]
name = "#test"

[[channel]]
name = "#bna-bot"

[[channel]]
name = "#chat"

[[channel]]
name = "#bot"

[[channel]]
name = "#nashmesh"

[[channel]]
name = "#weather"

[[channel]]
name = "#info"

[[channel]]
name = "#tn-middle"

[[channel]]
name = "#tn-williamson"

[[channel]]
name = "#bna-wx"

[[channel]]
name = "#wx"

[[channel]]
name = "#southeast"

[[channel]]
name = "#atlanta"
